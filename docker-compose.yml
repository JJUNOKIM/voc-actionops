name: voc-actionops

services:
  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voc_actionops}
      MYSQL_USER: ${MYSQL_USER:-local_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_password}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai-worker:
    build:
      context: ./ai-worker
    ports:
      - "${AI_WORKER_PORT:-8000}:8000"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AI_WORKER_API_KEY: ${AI_WORKER_API_KEY:-local-ai-worker-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voc_actionops}
      MYSQL_USER: ${MYSQL_USER:-local_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_password}
      JWT_SECRET: ${JWT_SECRET:-voc-actionops-local-jwt-secret-key-2026}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-30m}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-14d}
      AI_WORKER_BASE_URL: http://ai-worker:8000
      AI_WORKER_API_KEY: ${AI_WORKER_API_KEY:-local-ai-worker-key}
      AI_WORKER_MODEL_NAME: ${AI_WORKER_MODEL_NAME:-deterministic-v1}
      AI_WORKER_CONNECT_TIMEOUT: ${AI_WORKER_CONNECT_TIMEOUT:-2s}
      AI_WORKER_READ_TIMEOUT: ${AI_WORKER_READ_TIMEOUT:-30s}
      AI_WORKER_MAX_ATTEMPTS: ${AI_WORKER_MAX_ATTEMPTS:-3}
      DATASET_UPLOAD_DIRECTORY: /var/lib/voc-actionops/uploads
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      DEMO_ORGANIZATION_NAME: ${DEMO_ORGANIZATION_NAME:-VOC ActionOps Demo}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-admin@voc-actionops.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo-password}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-Demo Admin}
    volumes:
      - backend-uploads:/var/lib/voc-actionops/uploads
    depends_on:
      mysql:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
  backend-uploads:
